<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Archivio Link</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b1324;
        --panel: #18243f;
        --ink: #f4efe6;
        --muted: rgba(244, 239, 230, 0.55);
        --accent: #d9771f;
        --accent-grad: linear-gradient(135deg, #e67e22 0%, #f0b35a 100%);
        --border: rgba(255, 255, 255, 0.1);
        --panel-border: rgba(255, 255, 255, 0.06);
        --input-bg: rgba(255, 255, 255, 0.06);
        --error: rgba(167, 47, 47, 0.96);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font: 14px/1.45 "Segoe UI", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at top left, rgba(201, 107, 23, 0.12), transparent 30%),
          radial-gradient(circle at top right, rgba(35, 74, 132, 0.1), transparent 25%),
          linear-gradient(180deg, #18243f 0%, var(--bg) 100%);
        min-height: 100vh;
      }

      main {
        max-width: 1420px;
        margin: 0 auto;
        padding: 28px 24px 64px;
      }

      .hero,
      .panel {
        background: var(--panel);
        border: 1px solid var(--panel-border);
        border-radius: 16px;
        box-shadow: 0 24px 60px rgba(14, 23, 44, 0.35);
      }

      .hero {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 16px;
        padding: 22px 24px;
        margin-bottom: 16px;
      }

      .hero h1 {
        margin: 0 0 6px;
        font-size: clamp(26px, 4vw, 38px);
        line-height: 1.05;
        color: var(--ink);
      }

      .hero p {
        margin: 0;
        color: var(--muted);
        max-width: 720px;
      }

      .hero-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: flex-start;
      }

      .hero-actions button {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 8px 16px;
        font-size: 13px;
      }

      .hero-actions .icon { width: 15px; height: 15px; }

      .filter-row,
      .badge-row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .layout {
        display: block;
      }

      .panel {
        padding: 14px;
      }

      .panel h2 {
        margin-top: 0;
        margin-bottom: 10px;
      }

      label {
        display: block;
        font-weight: 700;
        margin-bottom: 8px;
        color: var(--ink);
      }

      input,
      button {
        font: inherit;
      }

      input[type="text"] {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 10px 12px;
        background: var(--input-bg);
        color: var(--ink);
        outline: none;
      }

      input[type="text"]:focus {
        border-color: var(--accent);
      }

      button {
        border: 0;
        border-radius: 999px;
        padding: 9px 13px;
        background: var(--accent-grad);
        color: #24170b;
        font-weight: 700;
        cursor: pointer;
      }

      button.secondary {
        background: rgba(255, 255, 255, 0.08);
        color: var(--ink);
        border: 1px solid var(--border);
      }

      button.secondary:hover {
        background: rgba(255, 255, 255, 0.12);
      }

      button.warn {
        background: var(--error);
        color: #fff;
      }

      button:disabled,
      button.secondary:disabled,
      .icon-button:disabled {
        opacity: 0.3;
        cursor: not-allowed;
        pointer-events: none;
      }

      .search-label {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 0.02em;
        margin-bottom: 10px;
        color: var(--ink);
      }

      .search-label::before {
        content: "";
        display: inline-block;
        width: 3px;
        height: 16px;
        border-radius: 2px;
        background: var(--accent-grad);
        flex-shrink: 0;
      }

      .search-row,
      .form-grid {
        display: grid;
        gap: 8px;
      }

      .search-row {
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto;
        align-items: end;
        margin-bottom: 8px;
      }

      .search-row > div {
        min-width: 0;
      }

      .filter-row {
        align-items: center;
        justify-content: space-between;
        margin-bottom: 8px;
      }

      .filter-group,
      .pagination {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }

      .filter-chip {
        background: rgba(255, 255, 255, 0.08);
        color: var(--ink);
        border: 1px solid var(--border);
      }

      .filter-chip.is-active {
        background: rgba(242, 187, 105, 0.2);
        color: #ffd68b;
        border-color: rgba(242, 187, 105, 0.35);
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .checkbox-group {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .checkbox-pill {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 600;
        margin: 0;
        padding: 8px 10px;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.04);
        cursor: pointer;
        transition: background 0.15s;
      }

      .checkbox-pill:hover {
        background: rgba(255, 255, 255, 0.08);
      }

      .meta,
      .status,
      .item-url,
      .item-page-url,
      .empty,
      .sync-hint {
        color: var(--muted);
      }

      .meta {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .status {
        min-height: 1.4em;
        margin-top: 10px;
      }

      .list {
        overflow: auto;
        border: 1px solid var(--border);
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.03);
      }

      .table {
        width: 100%;
        min-width: 980px;
        border-collapse: collapse;
      }

      .table th,
      .table td {
        padding: 8px 10px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        text-align: left;
        vertical-align: top;
      }

      .table td:first-child { width: 100%; max-width: 0; }
      .table td:nth-child(2),
      .table td:nth-child(3) { width: 1%; white-space: nowrap; }

      .table th:first-child { min-width: 200px; }

      .table th {
        position: sticky;
        top: 0;
        z-index: 1;
        background: rgba(255, 255, 255, 0.04);
        font-size: 12px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .cell-title,
      .cell-url,
      .cell-page-url {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        max-width: 100%;
      }

      .cell-title {
        font-weight: 700;
        margin-bottom: 2px;
      }

      .cell-url,
      .cell-page-url {
        font-size: 12px;
      }

      .cell-url,
      .cell-page-url,
      .pagination-info {
        color: var(--muted);
      }

      .row-actions {
        display: flex;
        gap: 3px;
        flex-wrap: nowrap;
        white-space: normal;
      }

      .icon-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 34px;
        height: 34px;
        padding: 0;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.06);
        color: var(--ink);
        border: 1px solid transparent;
      }

      .icon-button:hover {
        background: rgba(255, 255, 255, 0.12);
      }

      .icon,
      .icon svg {
        display: block;
        width: 16px;
        height: 16px;
      }

      .icon svg {
        fill: currentColor;
      }

      .icon-button.is-active-seen {
        background: rgba(84, 214, 154, 0.18);
        color: #b9f6da;
        border-color: rgba(84, 214, 154, 0.3);
      }

      .icon-button.is-active-favorite {
        background: rgba(242, 187, 105, 0.18);
        color: #ffd68b;
        border-color: rgba(242, 187, 105, 0.3);
      }

      .badge {
        display: inline-flex;
        align-items: center;
        padding: 4px 10px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        font-size: 12px;
        font-weight: 700;
      }

      .badge.seen {
        background: rgba(84, 214, 154, 0.18);
        color: #b9f6da;
      }

      .badge.favorite {
        background: rgba(242, 187, 105, 0.2);
        color: #ffd68b;
      }

      .badge.tag {
        background: rgba(110, 160, 255, 0.18);
        color: #b3d0ff;
      }

      .empty {
        padding: 16px;
        border-top: 0;
        text-align: center;
      }

      .modal-shell {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 20px;
        background: rgba(5, 8, 18, 0.7);
        backdrop-filter: blur(6px);
        z-index: 20;
      }

      .modal-shell.is-open {
        display: flex;
      }

      .modal-card {
        width: min(560px, 100%);
        max-height: min(88vh, 760px);
        overflow: auto;
        padding: 18px;
      }

      .modal-head {
        display: flex;
        align-items: start;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 10px;
      }

      .modal-head h2 {
        margin: 0;
      }

      .modal-head > div:first-child {
        min-width: 0;
      }

      .modal-close {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 34px;
        height: 34px;
        padding: 0;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.08);
        color: var(--ink);
        border: 1px solid var(--border);
      }

      .modal-close:hover {
        background: rgba(255, 255, 255, 0.14);
      }

      .modal-status {
        font-size: 13px;
        min-height: 1.3em;
        margin: 8px 0;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      @media (max-width: 900px) {
        .hero,
        .search-row {
          grid-template-columns: 1fr;
        }

        .filter-row {
          align-items: flex-start;
        }
      }

      .tag-input {
        position: relative;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 4px;
        padding: 4px 8px;
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 6px;
        min-height: 36px;
      }
      .tag-input:focus-within {
        border-color: rgba(242, 187, 105, 0.5);
      }
      .tag-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }
      .tag-chip {
        display: inline-flex;
        align-items: center;
        gap: 3px;
        padding: 2px 8px;
        font-size: 12px;
        background: rgba(255,255,255,0.12);
        border-radius: 4px;
      }
      .tag-chip button {
        all: unset;
        cursor: pointer;
        width: 14px;
        height: 14px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        opacity: 0.6;
        border-radius: 50%;
      }
      .tag-chip button:hover { opacity: 1; background: rgba(255,255,255,0.15); }
      .tag-chip button svg { width: 12px; height: 12px; fill: currentColor; }
      .tag-input input {
        flex: 1;
        min-width: 80px;
        border: none;
        outline: none;
        background: none;
        color: var(--ink);
        font: inherit;
        font-size: 13px;
        padding: 2px 0;
      }
      .tag-suggestions {
        position: absolute;
        top: 100%;
        left: 0;
        right: 0;
        z-index: 10;
        background: #1a2744;
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 0 0 6px 6px;
        max-height: 140px;
        overflow-y: auto;
        display: none;
      }
      .tag-suggestions.is-visible { display: block; }
      .tag-suggestions-item {
        padding: 6px 10px;
        font-size: 13px;
        cursor: pointer;
      }
      .tag-suggestions-item:hover {
        background: rgba(255,255,255,0.08);
      }
    </style>
  </head>
  <body>
    <main>
      <section class="hero">
        <div>
          <h1>Archivio Link</h1>
          <p>Consulta tutti i link salvati, cercali rapidamente e gestiscili manualmente senza passare dalla pagina impostazioni.</p>
        </div>
        <div class="hero-actions">
          <button id="openCreateModalButton" type="button"><span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2Z"/></svg></span>Nuovo link</button>
          <button id="openOptionsButton" type="button" class="secondary"><span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.07.62-.07.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58ZM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2Z"/></svg></span>Impostazioni</button>
          <button id="refreshButton" type="button" class="secondary"><span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.96 7.96 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35Z"/></svg></span>Aggiorna</button>
        </div>
      </section>

      <section class="layout">
        <section class="panel">
          <div class="search-row">
            <div>
              <span class="search-label" id="archiveSearchLabel">Ricerca link</span>
              <input id="archiveSearch" type="text" placeholder="Cerca per titolo, URL o pagina di origine" aria-labelledby="archiveSearchLabel">
            </div>
            <div>
              <span class="search-label" data-i18n="filter_by_tags">Filtra per tag</span>
              <input id="archiveTagSearch" type="text" placeholder="work, design, personal" autocomplete="off">
            </div>
            <button id="archiveResetButton" type="button" class="secondary">Nuovo link</button>
          </div>
          <div class="filter-row">
            <div class="filter-group">
              <button id="filterUnseenButton" type="button" class="secondary filter-chip">Non visti</button>
              <button id="filterSeenButton" type="button" class="secondary filter-chip">Visti</button>
              <button id="filterFavoriteButton" type="button" class="secondary filter-chip">Favoriti</button>
            </div>
            <div class="pagination">
              <span id="paginationInfo" class="pagination-info"></span>
              <button id="firstPageButton" type="button" class="secondary">Prima</button>              
              <button id="prevPageButton" type="button" class="secondary">Prec</button>
              <button id="nextPageButton" type="button" class="secondary">Succ</button>
              <button id="lastPageButton" type="button" class="secondary">Ultima</button>
            </div>
          </div>
          <p id="syncHint" class="sync-hint"></p>
          <div id="archiveList" class="list"></div>
          <div id="status" class="status" aria-live="polite"></div>
        </section>
      </section>

      <div id="archiveModal" class="modal-shell" aria-hidden="true">
        <section class="panel modal-card" role="dialog" aria-modal="true" aria-labelledby="archiveModalTitle">
          <div class="modal-head">
            <div>
              <h2 id="archiveModalTitle">Modifica Link</h2>
              <p id="archiveFormMeta" class="meta">Aggiungi manualmente un link oppure selezionane uno dalla lista per modificarlo.</p>
            </div>
            <button id="archiveModalCloseButton" type="button" class="modal-close" aria-label="Chiudi finestra">
              <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m18.3 5.71-1.41-1.41L12 9.17 7.11 4.29 5.7 5.7 10.59 10.6 5.7 15.49l1.41 1.41L12 12l4.89 4.9 1.41-1.41-4.89-4.89 4.89-4.89Z"/></svg></span>
            </button>
          </div>
          <div class="form-grid">
            <div>
              <label for="archiveUrl">URL</label>
              <input id="archiveUrl" type="text" placeholder="https://example.com/articolo">
            </div>
            <div>
              <label for="archiveTitle">Titolo</label>
              <input id="archiveTitle" type="text" placeholder="Titolo del link">
            </div>
            <div>
              <label for="archivePageUrl">Pagina di origine opzionale</label>
              <input id="archivePageUrl" type="text" placeholder="https://example.com/pagina">
            </div>
            <div>
              <label data-i18n="tags_label">Tags</label>
              <div class="tag-input" id="archiveTagInput">
                <div class="tag-chips" id="archiveTagChips"></div>
                <input type="text" id="archiveTagField" placeholder="Aggiungi tag e premi Invio" autocomplete="off" data-i18n-placeholder="tag_placeholder">
                <div class="tag-suggestions" id="archiveTagSuggestions"></div>
              </div>
            </div>
            <div class="checkbox-group" style="margin-top: 4px">
              <label class="checkbox-pill"><input id="archiveIsSeen" type="checkbox"> <span>Gia visto</span></label>
              <label class="checkbox-pill"><input id="archiveIsFavorite" type="checkbox"> <span>Favorito</span></label>
            </div>
            <div id="modalStatus" class="modal-status" aria-live="polite"></div>
            <div class="hero-actions">
              <button id="archiveSaveButton" type="button">Aggiungi link</button>
              <button id="archiveCancelButton" type="button" class="secondary">Annulla modifica</button>
            </div>
          </div>
        </section>
      </div>
    </main>
    <script type="module" src="./links.js"></script>
  </body>
</html>
