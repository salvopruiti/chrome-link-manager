  <text x="370" y="378" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#f4efe6">React 2026 Guide — Modern Frameworks Compared</text>
  <text x="370" y="392" font-family="Segoe UI, sans-serif" font-size="11" fill="rgba(244,239,230,0.5)">https://example.com/react-guide-2026</text>
  <rect x="844" y="366" width="28" height="24" rx="6" fill="rgba(255,255,255,0.08)"/>
