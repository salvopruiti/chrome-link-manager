  <rect x="912" y="366" width="28" height="24" rx="6" fill="rgba(255,255,255,0.08)"/>

  <rect x="360" y="404" width="560" height="40" rx="8" fill="rgba(255,255,255,0.04)"/>
  <text x="370" y="424" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#f4efe6">TypeScript 5.x — What's New and Migration Guide</text>
  <text x="370" y="438" font-family="Segoe UI, sans-serif" font-size="11" fill="rgba(244,239,230,0.5)">https://example.com/typescript-5-new</text>
  <rect x="844" y="412" width="28" height="24" rx="6" fill="rgba(255,255,255,0.08)"/>
  <rect x="878" y="412" width="28" height="24" rx="6" fill="rgba(255,255,255,0.08)"/>
  <rect x="912" y="412" width="28" height="24" rx="6" fill="rgba(255,255,255,0.08)"/>

  <rect x="360" y="450" width="560" height="40" rx="8" fill="rgba(255,255,255,0.04)"/>
  <text x="370" y="470" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#f4efe6">CSS Grid vs Flexbox — A Practical Comparison</text>
  <text x="370" y="484" font-family="Segoe UI, sans-serif" font-size="11" fill="rgba(244,239,230,0.5)">https://example.com/css-grid-flexbox</text>
  <rect x="844" y="458" width="28" height="24" rx="6" fill="rgba(255,255,255,0.08)"/>
  <rect x="878" y="458" width="28" height="24" rx="6" fill="rgba(255,255,255,0.08)"/>
