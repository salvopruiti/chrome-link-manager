  <rect x="56" y="16" width="320" height="16" rx="8" fill="rgba(255,255,255,0.06)"/>
  <circle cx="1250" cy="24" r="8" fill="rgba(255,255,255,0.08)"/>
  <circle cx="1266" cy="24" r="8" fill="rgba(255,255,255,0.08)"/>

  <!-- Page content -->
